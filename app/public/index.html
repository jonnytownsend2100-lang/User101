<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swarm Console</title>
  <meta name="description" content="Real-time console for the swarm: submit tasks, run worker nodes, watch the atomic claim." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%2338bdf8'/%3E%3Ccircle cx='6' cy='7' r='3' fill='%236366f1'/%3E%3Ccircle cx='26' cy='7' r='3' fill='%236366f1'/%3E%3Ccircle cx='6' cy='25' r='3' fill='%236366f1'/%3E%3Ccircle cx='26' cy='25' r='3' fill='%236366f1'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 16 6 7M16 16l10-9M16 16 6 25M16 16l10 9" stroke="currentColor" stroke-width="1.5" fill="none" opacity=".5" />
        <circle cx="16" cy="16" r="5" fill="currentColor" />
        <circle cx="6" cy="7" r="2.4" fill="currentColor" opacity=".7" />
        <circle cx="26" cy="7" r="2.4" fill="currentColor" opacity=".7" />
        <circle cx="6" cy="25" r="2.4" fill="currentColor" opacity=".7" />
        <circle cx="26" cy="25" r="2.4" fill="currentColor" opacity=".7" />
      </svg>
      <div>
        <h1>Swarm Console</h1>
        <p class="tagline">atomic claim &middot; lease &middot; retry &middot; dead-letter</p>
      </div>
    </div>

    <div class="topbar-right">
      <span id="connection" class="conn conn--connecting" title="event stream status">
        <i class="dot"></i><span id="connection-text">connecting</span>
      </span>
      <div class="stepper" role="group" aria-label="worker nodes">
        <button id="nodes-down" class="icon-btn" type="button" aria-label="one fewer node">&minus;</button>
        <span class="stepper-value"><b id="nodes-count">0</b> nodes</span>
        <button id="nodes-up" class="icon-btn" type="button" aria-label="one more node">+</button>
      </div>
      <button id="seed" class="btn" type="button">Seed demo</button>
      <button id="burst" class="btn" type="button">Burst &times;25</button>
    </div>
  </header>

  <section class="stats" id="stats" aria-label="queue statistics"></section>

  <main class="layout">
    <section class="panel panel--board">
      <div class="panel-head">
        <h2>Task board</h2>
        <div class="tabs" id="filters" role="tablist">
          <button class="tab is-active" data-filter="all" role="tab">All</button>
          <button class="tab" data-filter="active" role="tab">Active</button>
          <button class="tab" data-filter="done" role="tab">Done</button>
          <button class="tab" data-filter="failed" role="tab">Failed</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="tasks">
          <thead>
            <tr>
              <th class="col-state">State</th>
              <th class="col-kind">Kind</th>
              <th class="col-title">Task</th>
              <th class="col-node">Node</th>
              <th class="col-attempts">Tries</th>
              <th class="col-result">Result</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="task-rows"></tbody>
        </table>
        <p class="empty" id="empty-board" hidden>No tasks yet &mdash; submit one, or hit <b>Seed demo</b>.</p>
      </div>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="panel-head"><h2>Submit a task</h2></div>
        <form id="submit-form" class="form" autocomplete="off">
          <label>Title
            <input id="f-title" name="title" type="text" placeholder="e.g. count primes below 200k" required />
          </label>
          <label>Kind
            <select id="f-kind" name="kind"></select>
          </label>
          <label>Payload (JSON)
            <textarea id="f-payload" name="payload" rows="3" spellcheck="false">{}</textarea>
          </label>
          <div class="presets" id="presets"></div>
          <button class="btn btn--primary" type="submit">Enqueue task</button>
          <p class="form-error" id="form-error" hidden></p>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Node pool</h2>
          <span class="muted" id="pool-summary"></span>
        </div>
        <ul class="nodes" id="node-list"></ul>
      </section>

      <section class="panel panel--log">
        <div class="panel-head">
          <h2>Activity</h2>
          <button id="log-toggle" class="link-btn" type="button">pause</button>
        </div>
        <ul class="log" id="log"></ul>
      </section>
    </aside>
  </main>

  <footer class="footer">
    <span id="foot-config"></span>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
